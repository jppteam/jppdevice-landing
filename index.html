        <h1>J++Device</h1>
        <p>
          The J++Device is a tiny, open, pocket-sized ESP32-C6 handheld you write
          your own apps for. It boots into a launcher and runs sandboxed apps —
          games, tools, and demos — from a microSD card, written in MicroPython
          or native C. It runs the open-source JPPDOS firmware.
        </p>
        <p>
          It is not for sale: build your own from the published open hardware and
          firmware, or receive a numbered unit at J++Meetup 2026 in Moscow.
        </p>
